name: CI

on:
  push:
  pull_request:

jobs:
  php:
    name: PHP (lint, 5.5 compatibility, self-checks)
    runs-on: ubuntu-latest
    env:
      PHPCS_VERSION: 3.13.2
      PHPCOMPAT_VERSION: 9.3.5
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Lint
        run: |
          for f in compat.php idna.php config.php init.php index.php service.php view.php tools/compile-templates.php; do
            php -l "$f" || exit 1
          done

      - name: PHP 5.5 compatibility
        run: |
          curl -sSLo phpcs.phar "https://github.com/PHPCSStandards/PHP_CodeSniffer/releases/download/${PHPCS_VERSION}/phpcs.phar"
          curl -sSLo phpcompat.tgz "https://github.com/PHPCompatibility/PHPCompatibility/archive/refs/tags/${PHPCOMPAT_VERSION}.tar.gz"
          tar xzf phpcompat.tgz
          php phpcs.phar --runtime-set installed_paths "$PWD/PHPCompatibility-${PHPCOMPAT_VERSION}"

      - name: Self-checks
        run: php tests/selfcheck.php

  js:
    name: JS syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: node --check js/vea.js
